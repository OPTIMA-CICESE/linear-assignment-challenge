name: Windows

# Compila el .exe de Windows sin necesitar una PC con Windows:
# al hacer push (o a mano desde la pestaña Actions) sube el artefacto.
# Al publicar una etiqueta v* el .exe tambien se adjunta al Release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generar icono
        run: python tools/make_icon.py

      - name: Empaquetar
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed ^
            --name PCRepairChallenge ^
            --icon assets\icon.ico ^
            --add-data "assets/logos;assets/logos" ^
            --add-data "assets/icon.png;assets" ^
            --add-data "assets/fonts;assets/fonts" ^
            main.py

      - name: Comprobar que arranca
        run: dist\PCRepairChallenge.exe --test
        continue-on-error: true

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: PCRepairChallenge-windows
          path: dist/PCRepairChallenge.exe
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/PCRepairChallenge.exe
