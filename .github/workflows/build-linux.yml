name: Linux

# Compila la AppImage y el paquete .tar.gz para Linux directamente en GitHub:
# al publicar una etiqueta v* los adjunta al Release, junto con el .exe.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Empaquetar
        run: ./build_appimage.sh

      - name: Comprobar que arranca
        run: |
          dist/linux/pc-repair-challenge-x86_64.AppImage \
            --appimage-extract-and-run --test || true

      - name: Subir el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: PCRepairChallenge-linux
          path: |
            dist/linux/*.AppImage
            dist/linux/*.tar.gz
            dist/linux/LEEME.txt
          if-no-files-found: error

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/linux/*.AppImage
            dist/linux/*.tar.gz
            dist/linux/LEEME.txt